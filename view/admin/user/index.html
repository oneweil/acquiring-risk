{extend name="/admin/layout/admin" /}

{block name="content"}
<form id="userFilterForm"></form>

<div class="row row-cards mb-3" id="userKpiRow">
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">用户总数</div>
        <div class="h2 mb-0" id="userKpiTotal">—</div>
        <div class="text-secondary small">全部账号</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">启用中</div>
        <div class="h2 mb-0 text-green" id="userKpiEnabled">—</div>
        <div class="text-secondary small">可登录</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">已分配角色</div>
        <div class="h2 mb-0" id="userKpiBound">—</div>
        <div class="text-secondary small">至少绑定 1 个角色</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">停用 / 锁定</div>
        <div class="h2 mb-0 text-secondary" id="userKpiInactive">—</div>
        <div class="text-secondary small">不可登录</div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-table">
    <div class="card-header">
      <div class="row w-100 align-items-center g-2">
        <div class="col">
          <h3 class="card-title mb-0">{$list_card_title|default='用户管理'}</h3>
          <div class="text-secondary small">账号 · 角色绑定（无部门）</div>
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-primary btn-sm" id="userAddBtn">
            <i class="ti ti-plus me-1"></i>新增用户
          </button>
        </div>
      </div>
    </div>

    <div class="card-body border-bottom py-3">
      <div class="row g-2 align-items-end">
        <div class="col-6 col-md-4 col-xl-3">
          <input type="text" form="userFilterForm" name="keyword" class="form-control form-control-sm" placeholder="账号 / 姓名 / 手机 / 邮箱" value="">
        </div>
        <div class="col-6 col-md-4 col-xl-2">
          <select form="userFilterForm" name="status" class="form-select form-select-sm">
            <option value="">全部状态</option>
            {volist name="filter_options.status" id="label"}
            <option value="{$key}">{$label}</option>
            {/volist}
          </select>
        </div>
        <div class="col-6 col-md-4 col-xl-2">
          <select form="userFilterForm" name="role_id" class="form-select form-select-sm">
            <option value="">全部角色</option>
            {volist name="filter_options.role" id="label"}
            <option value="{$key}">{$label}</option>
            {/volist}
          </select>
        </div>
        <div class="col-6 col-md-4 col-xl-3">
          <div class="btn-list">
            <button type="submit" form="userFilterForm" class="btn btn-primary btn-sm">
              <i class="ti ti-search me-1"></i>查询
            </button>
            <button type="button" id="userFilterReset" class="btn btn-sm">重置</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-vcenter card-table table-nowrap">
        <thead>
          <tr>
            <th>账号</th>
            <th>姓名</th>
            <th>岗位</th>
            <th>手机</th>
            <th>角色</th>
            <th>状态</th>
            <th>最近登录</th>
            <th>更新时间</th>
            <th class="w-1">操作</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="9" class="text-center text-secondary py-5">
              <div class="spinner-border spinner-border-sm text-secondary me-2" role="status"></div>加载中…
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card-footer d-flex flex-wrap align-items-center gap-2" id="userTableFooter">
      <div id="userPageSize"></div>
      <div class="ms-auto d-flex flex-wrap align-items-center gap-2">
        <p class="m-0" id="userTableSummary" style="color: var(--tblr-pagination-disabled-color, var(--bs-pagination-disabled-color, var(--tblr-secondary)));">加载中…</p>
        <div id="userTablePager"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="userModalLabel">新增用户</h5>
          <div class="text-secondary small">设置登录账号与基本信息</div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <form id="userForm">
        <div class="modal-body">
          <input type="hidden" name="id" id="userId" value="">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label required" for="userAccount">账号</label>
              <input type="text" class="form-control" name="account" id="userAccount" maxlength="32" required autocomplete="off">
            </div>
            <div class="col-md-6">
              <label class="form-label required" for="userName">姓名</label>
              <input type="text" class="form-control" name="name" id="userName" maxlength="64" required>
            </div>
            <div class="col-md-6" id="userPasswordWrap">
              <label class="form-label required" for="userPassword">密码</label>
              <input type="password" class="form-control" name="password" id="userPassword" maxlength="64" autocomplete="new-password">
              <div class="form-hint" id="userPasswordHint">新增必填；编辑留空则不改密码</div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="userTitle">岗位</label>
              <input type="text" class="form-control" name="title" id="userTitle" maxlength="64">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="userPhone">手机</label>
              <input type="text" class="form-control" name="phone" id="userPhone" maxlength="32">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="userEmail">邮箱</label>
              <input type="email" class="form-control" name="email" id="userEmail" maxlength="128">
            </div>
            <div class="col-md-6">
              <label class="form-label required" for="userStatus">状态</label>
              <select class="form-select" name="status" id="userStatus" required>
                {volist name="filter_options.status" id="label"}
                <option value="{$key}">{$label}</option>
                {/volist}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="userRemark">备注</label>
              <textarea class="form-control" name="remark" id="userRemark" rows="2" maxlength="255"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-primary" id="userSaveBtn">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="userRoleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="userRoleModalLabel">分配角色</h5>
          <div class="text-secondary small" id="userRoleModalSub"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="userRoleUserId" value="">
        <div class="list-group list-group-flush" id="userRoleList"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="userRoleSaveBtn">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="userPwdModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title">重置密码</h5>
          <div class="text-secondary small" id="userPwdModalSub"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <form id="userPwdForm">
        <div class="modal-body">
          <input type="hidden" id="userPwdUserId" value="">
          <label class="form-label required" for="userNewPassword">新密码</label>
          <input type="password" class="form-control" id="userNewPassword" minlength="6" maxlength="64" required autocomplete="new-password">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-primary">确认重置</button>
        </div>
      </form>
    </div>
  </div>
</div>
{/block}

{block name="script"}
<script src="/static/js/admin/list-page.js?v=1.2.0"></script>
<script src="/static/js/admin/user.js?v=1.0.0"></script>
<script>
UserPage.init();
</script>
{/block}
