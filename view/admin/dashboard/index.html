{extend name="/admin/layout/admin" /}

{block name="content"}
<div class="row row-cards mb-3" id="dashKpiRow">
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">今日交易笔数</div>
        <div class="h1 mb-0 mt-1" id="kpiOrders">—</div>
        <div class="text-secondary small mt-1">实时累计</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">今日交易金额 (USD)</div>
        <div class="h1 mb-0 mt-1" id="kpiAmount">—</div>
        <div class="text-secondary small mt-1">等值汇总</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm border-danger">
      <div class="card-body">
        <div class="text-secondary">待处理预警</div>
        <div class="h1 mb-0 mt-1 text-danger" id="kpiAlerts">—</div>
        <div class="text-secondary small mt-1">需人工介入</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">拦截率</div>
        <div class="h1 mb-0 mt-1" id="kpiBlockRate">—</div>
        <div class="text-secondary small mt-1">今日拦截 / 总笔数</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">待审商户</div>
        <div class="h1 mb-0 mt-1" id="kpiPendingMerchants">—</div>
        <div class="text-secondary small mt-1">同步后待风控审核</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">活跃商户数</div>
        <div class="h1 mb-0 mt-1" id="kpiActiveMerchants">—</div>
        <div class="text-secondary small mt-1">状态正常</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">高风险订单</div>
        <div class="h1 mb-0 mt-1" id="kpiHighRisk">—</div>
        <div class="text-secondary small mt-1">今日命中</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">3DS 验证率</div>
        <div class="h1 mb-0 mt-1" id="kpi3dsRate">—</div>
        <div class="text-secondary small mt-1" id="kpi3dsHint">—</div>
      </div>
    </div>
  </div>
</div>

<div class="row row-cards mb-3">
  <div class="col-lg-7">
    <div class="card h-100">
      <div class="card-header">
        <h3 class="card-title">
          <i class="ti ti-bolt text-warning me-1"></i>实时订单流
        </h3>
        <div class="card-actions">
          <a href="/admin/order" class="btn btn-ghost-primary btn-sm">查看全部</a>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="dash-live-feed" id="liveFeed"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-5">
    <div class="card h-100">
      <div class="card-header">
        <h3 class="card-title">今日风险分布</h3>
      </div>
      <div class="card-body">
        <div id="riskDonutChart" class="position-relative"></div>
      </div>
    </div>
  </div>
</div>
{/block}

{block name="script"}
<script src="/static/apexcharts/apexcharts.min.js"></script>
<script src="/static/js/admin/dashboard.js"></script>
{/block}
