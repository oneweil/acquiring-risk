{extend name="/admin/layout/admin" /}

{block name="content"}
<form id="alertFilterForm"></form>

<div class="card">
  <div class="card-table">
    <div class="card-header">
      <div class="row w-100 align-items-center g-2">
        <div class="col">
          <h3 class="card-title mb-0">{$list_card_title|default='交易预警'}</h3>
          <div class="text-secondary small">命中规则产生的交易级预警记录与调单跟进（不表示订单挂起待审）</div>
        </div>
      </div>
    </div>

    <div class="card-body border-bottom py-3">
      <div class="alert alert-info mb-3" role="alert">
        <div>
          交易预警用于<strong>仅预警</strong>、<strong>调单跟进</strong>等高风险记录，处置<strong>不会改变</strong>订单授权终态。
          商户级人工审核（暴涨/暴跌等）尚未接入本页。
        </div>
      </div>
      <div class="row g-2 align-items-end">
        <div class="col-6 col-md-4 col-xl-2">
          <select form="alertFilterForm" name="risk_level" class="form-select form-select-sm">
            <option value="">全部风险等级</option>
            {volist name="filter_options.risk_level" id="label"}
            <option value="{$key}">{$label}</option>
            {/volist}
          </select>
        </div>
        <div class="col-6 col-md-4 col-xl-2">
          <select form="alertFilterForm" name="status" class="form-select form-select-sm">
            <option value="">全部状态</option>
            {volist name="filter_options.status" id="label"}
            <option value="{$key}">{$label}</option>
            {/volist}
          </select>
        </div>
        <div class="col-6 col-md-4 col-xl-2">
          <select form="alertFilterForm" name="measure_code" class="form-select form-select-sm">
            <option value="">全部策略</option>
            {volist name="filter_options.measure_code" id="label"}
            <option value="{$key}">{$label}</option>
            {/volist}
          </select>
        </div>
        <div class="col-6 col-md-4 col-xl-3">
          <div class="btn-list">
            <button type="submit" form="alertFilterForm" class="btn btn-primary btn-sm">
              <i class="ti ti-search me-1"></i>查询
            </button>
            <button type="button" id="alertFilterReset" class="btn btn-sm">重置</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-vcenter card-table table-nowrap">
        <thead>
          <tr>
            <th>预警编号</th>
            <th>预警时间</th>
            <th>商户号</th>
            <th>订单号</th>
            <th>金额</th>
            <th>风险等级</th>
            <th>规则名称</th>
            <th>处置策略</th>
            <th>状态</th>
            <th>STR报送</th>
            <th class="w-1">操作</th>
          </tr>
        </thead>
        <tbody id="alertTableBody">
          <tr>
            <td colspan="11" class="text-center text-secondary py-5">
              <div class="spinner-border spinner-border-sm text-secondary me-2" role="status"></div>加载中…
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card-footer d-flex flex-wrap align-items-center gap-2" id="alertTableFooter">
      <div id="alertPageSize"></div>
      <div class="ms-auto d-flex flex-wrap align-items-center gap-2">
        <p class="m-0" id="alertTableSummary" style="color: var(--tblr-pagination-disabled-color, var(--bs-pagination-disabled-color, var(--tblr-secondary)));">加载中…</p>
        <div id="alertTablePager"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="alertHandleModal" tabindex="-1" aria-labelledby="alertHandleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" id="alertHandleDialog">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="alertHandleModalLabel">预警处理</h5>
          <div class="text-secondary small" id="alertHandleSub"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body" id="alertHandleBody">
        <div class="text-center text-secondary py-4">加载中…</div>
      </div>
      <div class="modal-footer" id="alertHandleActions">
        <button type="button" class="btn" data-bs-dismiss="modal">关闭</button>
        <button type="button" class="btn btn-primary d-none" id="alertHandleSubmit">提交处理</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="alertFileInput" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.zip" class="d-none" multiple>
{/block}

{block name="script"}
<script src="/static/js/admin/list-page.js?v=1.2.0"></script>
<script src="/static/js/admin/alert.js?v=1.0.1"></script>
<script>
window.ALERT_HANDLE_ACTIONS = {:json_encode($handle_actions)};
AlertPage.init();
</script>
{/block}
