<div class="page-header d-print-none mb-3">
  <div class="row g-2 align-items-center">
    <div class="col">
      <div class="page-pretitle">后台管理</div>
      <h2 class="page-title">{$title}</h2>
    </div>
    <div class="col-auto ms-auto">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="/admin/dashboard">首页</a></li>
        <li class="breadcrumb-item active">{$title}</li>
      </ol>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <h3 class="card-title">{$list_card_title|default='列表'}</h3>
    <div class="card-actions">
      {notempty name="list_path"}
      <form method="get" action="{$list_path}" class="input-icon">
        <input type="search" name="{$list_quick_key|default='order_no'}" class="form-control form-control-sm" placeholder="{$list_quick_placeholder|default='快速筛选…'}" value="{$list_quick_value|default=''}" aria-label="快速筛选" style="min-width: 14rem;">
        <span class="input-icon-addon"><i class="ti ti-search"></i></span>
      </form>
      {/notempty}
    </div>
  </div>
  <div class="card-body">
