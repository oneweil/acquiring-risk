{extend name="/admin/layout/admin" /}

{block name="content"}
<form id="roleFilterForm"></form>

<div class="row row-cards mb-3" id="roleKpiRow">
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">角色总数</div>
        <div class="h2 mb-0" id="roleKpiTotal">—</div>
        <div class="text-secondary small">含内置与自定义</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">启用中</div>
        <div class="h2 mb-0 text-green" id="roleKpiEnabled">—</div>
        <div class="text-secondary small">可分配使用</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">关联用户</div>
        <div class="h2 mb-0" id="roleKpiUsers">—</div>
        <div class="text-secondary small">已绑定账号数</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="text-secondary">权限点</div>
        <div class="h2 mb-0" id="roleKpiPerms">—</div>
        <div class="text-secondary small">系统可配置权限</div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-table">
    <div class="card-header">
      <div class="row w-100 align-items-center g-2">
        <div class="col">
          <h3 class="card-title mb-0">{$list_card_title|default='角色管理'}</h3>
          <div class="text-secondary small">配置角色与菜单/操作权限</div>
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-primary btn-sm" id="roleAddBtn">
            <i class="ti ti-plus me-1"></i>新增角色
          </button>
        </div>
      </div>
    </div>

    <div class="card-body border-bottom py-3">
      <div class="row g-2 align-items-end">
        <div class="col-6 col-md-4 col-xl-3">
          <input type="text" form="roleFilterForm" name="keyword" class="form-control form-control-sm" placeholder="角色名称 / 编码 / 描述" value="">
        </div>
        <div class="col-6 col-md-4 col-xl-2">
          <select form="roleFilterForm" name="status" class="form-select form-select-sm">
            <option value="">全部状态</option>
            {volist name="filter_options.status" id="label"}
            <option value="{$key}">{$label}</option>
            {/volist}
          </select>
        </div>
        <div class="col-6 col-md-4 col-xl-2">
          <select form="roleFilterForm" name="type" class="form-select form-select-sm">
            <option value="">全部类型</option>
            {volist name="filter_options.type" id="label"}
            <option value="{$key}">{$label}</option>
            {/volist}
          </select>
        </div>
        <div class="col-6 col-md-4 col-xl-3">
          <div class="btn-list">
            <button type="submit" form="roleFilterForm" class="btn btn-primary btn-sm">
              <i class="ti ti-search me-1"></i>查询
            </button>
            <button type="button" id="roleFilterReset" class="btn btn-sm">重置</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-vcenter card-table table-nowrap">
        <thead>
          <tr>
            <th>角色编码</th>
            <th>角色名称</th>
            <th>类型</th>
            <th>状态</th>
            <th>关联用户</th>
            <th>权限数</th>
            <th>更新时间</th>
            <th class="w-1">操作</th>
          </tr>
        </thead>
        <tbody id="roleTableBody">
          <tr>
            <td colspan="8" class="text-center text-secondary py-5">
              <div class="spinner-border spinner-border-sm text-secondary me-2" role="status"></div>加载中…
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card-footer d-flex flex-wrap align-items-center gap-2" id="roleTableFooter">
      <div id="rolePageSize"></div>
      <div class="ms-auto d-flex flex-wrap align-items-center gap-2">
        <p class="m-0" id="roleTableSummary" style="color: var(--tblr-pagination-disabled-color, var(--bs-pagination-disabled-color, var(--tblr-secondary)));">加载中…</p>
        <div id="roleTablePager"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="roleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="roleModalLabel">新增角色</h5>
          <div class="text-secondary small">设置角色基本信息</div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <form id="roleForm">
        <div class="modal-body">
          <input type="hidden" name="id" id="roleId" value="">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label required" for="roleCode">角色编码</label>
              <input type="text" class="form-control text-uppercase" name="code" id="roleCode" maxlength="64" required>
            </div>
            <div class="col-md-6">
              <label class="form-label required" for="roleName">角色名称</label>
              <input type="text" class="form-control" name="name" id="roleName" maxlength="64" required>
            </div>
            <div class="col-md-6">
              <label class="form-label required" for="roleStatus">状态</label>
              <select class="form-select" name="status" id="roleStatus" required>
                {volist name="filter_options.status" id="label"}
                <option value="{$key}">{$label}</option>
                {/volist}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="roleSort">排序</label>
              <input type="number" class="form-control" name="sort" id="roleSort" min="0" value="100">
            </div>
            <div class="col-12">
              <label class="form-label" for="roleDesc">描述</label>
              <textarea class="form-control" name="description" id="roleDesc" rows="2" maxlength="255"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="rolePermModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="rolePermModalLabel">配置权限</h5>
          <div class="text-secondary small" id="rolePermModalSub"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="rolePermRoleId" value="">
        <div class="d-flex align-items-center gap-2 mb-3">
          <button type="button" class="btn btn-sm" id="rolePermSelectAll">全选</button>
          <button type="button" class="btn btn-sm" id="rolePermClearAll">清空</button>
          <span class="text-secondary small" id="rolePermSelectedHint">已选 0 项</span>
        </div>
        <div id="rolePermTree"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="rolePermSaveBtn">保存权限</button>
      </div>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="roleUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="roleUserModalLabel">分配用户</h5>
          <div class="text-secondary small" id="roleUserModalSub"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="roleUserRoleId" value="">
        <input type="text" class="form-control form-control-sm mb-3" id="roleUserFilter" placeholder="姓名 / 账号 / 岗位">
        <div class="list-group list-group-flush" id="roleUserList" style="max-height:360px;overflow:auto;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="roleUserSaveBtn">保存</button>
      </div>
    </div>
  </div>
</div>
{/block}

{block name="script"}
<script src="/static/js/admin/list-page.js?v=1.2.0"></script>
<script src="/static/js/admin/role.js?v=1.0.0"></script>
<script>
RolePage.init();
</script>
{/block}
